name: Build MEDIQ AI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Full Flutter Project & Inject UI
        run: |
          flutter create --org com.mediq.ai --project-name mediq_ai app_build
          cp main.dart app_build/lib/main.dart
          sed -i 's/Monitor_heart_rounded/monitor_heart_rounded/g' app_build/lib/main.dart

      - name: Build Release APK
        working-directory: app_build
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MEDIQ-AI-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to Releases (Direct Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "MEDIQ AI Build #${{ github.run_number }}"
          files: app_build/build/app/outputs/flutter-apk/app-release.apk
